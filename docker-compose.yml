# LeaseLens — full-stack deployment
# Run the whole stack (FastAPI backend + Next.js frontend) with:
#   docker compose up --build
# Then open http://localhost:3000  (API docs: http://localhost:8000/docs)
# Copy .env.example to .env and fill in your own API keys first.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Keys are injected as environment variables; backend/config.py reads
    # them via pydantic-settings (its backend/.env file is optional).
    env_file:
      - .env
    volumes:
      # Persist uploads, seeded samples and the CreditShield disk cache.
      - backend_storage:/app/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time; the visitor's browser calls the backend
        # through the host-published port 8000.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
